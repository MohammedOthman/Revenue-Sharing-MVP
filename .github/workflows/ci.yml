name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  backend:
    name: Backend tests (with PostgreSQL)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: revenue-share-platform/backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: revenue_share
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: revenue_share
      DB_USER: postgres
      DB_PASSWORD: postgres
      JWT_SECRET: ci-secret-value-at-least-32-characters
      RUN_DB_TESTS: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: revenue-share-platform/backend/package-lock.json
      - run: npm ci
      - run: npm run migrate
      - run: npm run seed
      - run: npm test

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: revenue-share-platform/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: revenue-share-platform/frontend/package-lock.json
      - run: npm ci
      - run: npm run build
