name: Platform CI

on:
  push:
    branches: [main]
    paths: ['revenue-share-platform/**', '.github/workflows/platform-ci.yml']
  pull_request:
    paths: ['revenue-share-platform/**', '.github/workflows/platform-ci.yml']

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: revenue-share-platform/backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: revenue_share_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: revenue-share-platform/backend/package-lock.json
      - run: npm ci
      - name: Run API tests
        run: npm test
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/revenue_share_test

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: revenue-share-platform/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: revenue-share-platform/frontend/package-lock.json
      - run: npm ci
      - run: npm run build
