# Netlify deploy config — Reven frontend (Vite/React SPA; backend is Base44).
# The app lives in a subfolder, so `base` points Netlify at it and `publish`
# is resolved relative to that base.
[build]
  base = "revenue-share-platform/frontend"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# SPA fallback (redundant with public/_redirects, kept for reproducibility).
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
