# Render Blueprint — deploys the Reven app (backend serving the built React UI)
# as one Docker web service. In Render: New → Blueprint → connect this repo, then
# fill the two secret env vars below. The app auto-runs migrations at boot; the
# Supabase schema is already applied, so it starts serving immediately.
#
# Set these in the Render dashboard (marked sync:false so they are not committed):
#   DATABASE_URL = Supabase pooler URI (Project Settings → Database → Connection
#                  string → URI, Transaction pooler)
#   JWT_SECRET   = a long random string (openssl rand -base64 48)
services:
  - type: web
    name: reven
    runtime: docker
    rootDir: revenue-share-platform
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_SSL
        value: "true"
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
