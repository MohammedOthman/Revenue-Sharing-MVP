openapi: 3.0.3
info:
  title: Reven — Partner Revenue OS API
  version: 1.0.0
  description: >
    Phase 1 "Capture" API for partner revenue and revenue-sharing governance:
    partners, contracts, governed amendment journeys, revenue-share records,
    KPIs, legal-document metadata, and dashboard analytics.


    Phase boundary: this API does NOT move money. It records and previews
    revenue-share data and payout-readiness status only. There is no
    payment-execution, settlement, tax-clearance, or ERP-write endpoint.
servers:
  - url: /api
    description: Same-origin API base path
tags:
  - name: Auth
  - name: Partners
  - name: Contracts
  - name: Amendments
  - name: Revenue
  - name: KPIs
  - name: Documents
  - name: Dashboard
  - name: Claims
  - name: Attribution
  - name: Protection
  - name: Evidence
  - name: Audit
  - name: System

security:
  - bearerAuth: []

paths:
  /health:
    get:
      tags: [System]
      summary: Health check
      security: []
      responses:
        '200':
          description: API is running
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
                  message: { type: string }

  /auth/register:
    post:
      tags: [Auth]
      summary: Register a new user
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, fullName]
              properties:
                email: { type: string, format: email }
                password: { type: string, format: password }
                fullName: { type: string }
                role: { type: string }
      responses:
        '201':
          description: Registered
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '409': { $ref: '#/components/responses/Conflict' }

  /auth/login:
    post:
      tags: [Auth]
      summary: Log in
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, format: password }
      responses:
        '200':
          description: Logged in
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/profile:
    get:
      tags: [Auth]
      summary: Get the current user
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                type: object
                properties:
                  user: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /partners:
    get:
      tags: [Partners]
      summary: List partners
      parameters:
        - { in: query, name: status, schema: { type: string } }
        - { in: query, name: type, schema: { type: string } }
      responses:
        '200':
          description: Partners
          content:
            application/json:
              schema:
                type: object
                properties:
                  partners:
                    type: array
                    items: { $ref: '#/components/schemas/Partner' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Partners]
      summary: Create a partner
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PartnerInput' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  partner: { $ref: '#/components/schemas/Partner' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /partners/stats:
    get:
      tags: [Partners]
      summary: Partner statistics
      responses:
        '200': { $ref: '#/components/responses/Stats' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /partners/export:
    get:
      tags: [Partners]
      summary: Export partners as CSV (tenant-scoped)
      parameters:
        - { in: query, name: status, schema: { type: string } }
        - { in: query, name: type, schema: { type: string } }
      responses:
        '200':
          description: CSV export
          content:
            text/csv:
              schema: { type: string }
  /partners/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [Partners]
      summary: Get a partner
      responses:
        '200':
          description: Partner
          content:
            application/json:
              schema:
                type: object
                properties:
                  partner: { $ref: '#/components/schemas/Partner' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Partners]
      summary: Update a partner
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PartnerInput' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  partner: { $ref: '#/components/schemas/Partner' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Partners]
      summary: Delete a partner
      responses:
        '200': { $ref: '#/components/responses/Message' }

  /contracts:
    get:
      tags: [Contracts]
      summary: List contracts
      parameters:
        - { in: query, name: status, schema: { type: string } }
        - { in: query, name: partnerId, schema: { type: integer } }
      responses:
        '200':
          description: Contracts
          content:
            application/json:
              schema:
                type: object
                properties:
                  contracts:
                    type: array
                    items: { $ref: '#/components/schemas/Contract' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Contracts]
      summary: Create a contract
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ContractInput' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  contract: { $ref: '#/components/schemas/Contract' }
        '400': { $ref: '#/components/responses/ValidationError' }
  /contracts/stats:
    get:
      tags: [Contracts]
      summary: Contract statistics
      responses:
        '200': { $ref: '#/components/responses/Stats' }
  /contracts/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [Contracts]
      summary: Get a contract
      responses:
        '200':
          description: Contract
          content:
            application/json:
              schema:
                type: object
                properties:
                  contract: { $ref: '#/components/schemas/Contract' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Contracts]
      summary: Update a contract
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ContractInput' }
      responses:
        '200': { $ref: '#/components/responses/Message' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Contracts]
      summary: Delete a contract
      responses:
        '200': { $ref: '#/components/responses/Message' }

  /amendments:
    get:
      tags: [Amendments]
      summary: List amendment journeys
      parameters:
        - { in: query, name: status, schema: { type: string } }
        - { in: query, name: contractId, schema: { type: integer } }
      responses:
        '200':
          description: Amendment journeys (each includes a readiness object)
          content:
            application/json:
              schema:
                type: object
                properties:
                  amendments:
                    type: array
                    items: { $ref: '#/components/schemas/Amendment' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Amendments]
      summary: Create an amendment journey
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AmendmentInput' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  amendment: { $ref: '#/components/schemas/Amendment' }
        '400': { $ref: '#/components/responses/ValidationError' }
  /amendments/stats:
    get:
      tags: [Amendments]
      summary: Amendment statistics
      responses:
        '200': { $ref: '#/components/responses/Stats' }
  /amendments/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [Amendments]
      summary: Get an amendment journey
      responses:
        '200':
          description: Amendment journey
          content:
            application/json:
              schema:
                type: object
                properties:
                  amendment: { $ref: '#/components/schemas/Amendment' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Amendments]
      summary: Update an amendment journey (blocked once notified)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AmendmentInput' }
      responses:
        '200': { $ref: '#/components/responses/Message' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [Amendments]
      summary: Delete an amendment journey
      responses:
        '200': { $ref: '#/components/responses/Message' }
  /amendments/{id}/send-notice:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    post:
      tags: [Amendments]
      summary: Send the amendment notice
      description: >
        Blocked (422) until every readiness requirement is met; the response
        lists the missing requirements. A notified journey cannot be re-sent.
      responses:
        '200': { $ref: '#/components/responses/Message' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422':
          description: Readiness requirements not met
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: string }
                  missing:
                    type: array
                    items: { type: string }
                  readiness: { $ref: '#/components/schemas/Readiness' }
  /amendments/{id}/acknowledge:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    post:
      tags: [Amendments]
      summary: Acknowledge a sent notice
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                note: { type: string }
      responses:
        '200': { $ref: '#/components/responses/Message' }
        '409': { $ref: '#/components/responses/Conflict' }

  /revenue:
    get:
      tags: [Revenue]
      summary: List revenue-share records
      parameters:
        - { in: query, name: status, schema: { type: string } }
        - { in: query, name: contractId, schema: { type: integer } }
      responses:
        '200':
          description: Revenue-share records
          content:
            application/json:
              schema:
                type: object
                properties:
                  revenueShares:
                    type: array
                    items: { $ref: '#/components/schemas/RevenueShare' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Revenue]
      summary: Create a revenue-share record (records/previews only — no payment)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RevenueShareInput' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  revenueShare: { $ref: '#/components/schemas/RevenueShare' }
        '400': { $ref: '#/components/responses/ValidationError' }
  /revenue/stats:
    get:
      tags: [Revenue]
      summary: Revenue statistics
      responses:
        '200': { $ref: '#/components/responses/Stats' }
  /revenue/trends:
    get:
      tags: [Revenue]
      summary: Revenue by period
      parameters:
        - { in: query, name: periodType, schema: { type: string, enum: [month, quarter, year] } }
      responses:
        '200':
          description: Trend rows
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { type: object } }
  /revenue/export:
    get:
      tags: [Revenue]
      summary: Export revenue-share records as CSV (tenant-scoped)
      parameters:
        - { in: query, name: status, schema: { type: string } }
        - { in: query, name: contractId, schema: { type: integer } }
      responses:
        '200':
          description: CSV export
          content:
            text/csv:
              schema: { type: string }
  /revenue/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [Revenue]
      summary: Get a revenue-share record
      responses:
        '200':
          description: Revenue-share record
          content:
            application/json:
              schema:
                type: object
                properties:
                  revenueShare: { $ref: '#/components/schemas/RevenueShare' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Revenue]
      summary: Update a revenue-share record
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RevenueShareInput' }
      responses:
        '200': { $ref: '#/components/responses/Message' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Revenue]
      summary: Delete a revenue-share record
      responses:
        '200': { $ref: '#/components/responses/Message' }

  /kpis:
    get:
      tags: [KPIs]
      summary: List KPIs
      parameters:
        - { in: query, name: status, schema: { type: string } }
        - { in: query, name: contractId, schema: { type: integer } }
      responses:
        '200':
          description: KPIs
          content:
            application/json:
              schema:
                type: object
                properties:
                  kpis:
                    type: array
                    items: { $ref: '#/components/schemas/KPI' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [KPIs]
      summary: Create a KPI
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/KPIInput' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  kpi: { $ref: '#/components/schemas/KPI' }
        '400': { $ref: '#/components/responses/ValidationError' }
  /kpis/stats:
    get:
      tags: [KPIs]
      summary: KPI statistics
      responses:
        '200': { $ref: '#/components/responses/Stats' }
  /kpis/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [KPIs]
      summary: Get a KPI
      responses:
        '200':
          description: KPI
          content:
            application/json:
              schema:
                type: object
                properties:
                  kpi: { $ref: '#/components/schemas/KPI' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [KPIs]
      summary: Update a KPI
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/KPIInput' }
      responses:
        '200': { $ref: '#/components/responses/Message' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [KPIs]
      summary: Delete a KPI
      responses:
        '200': { $ref: '#/components/responses/Message' }

  /documents:
    get:
      tags: [Documents]
      summary: List legal-document metadata
      parameters:
        - { in: query, name: status, schema: { type: string } }
        - { in: query, name: contractId, schema: { type: integer } }
        - { in: query, name: documentType, schema: { type: string } }
      responses:
        '200':
          description: Documents
          content:
            application/json:
              schema:
                type: object
                properties:
                  documents:
                    type: array
                    items: { $ref: '#/components/schemas/LegalDocument' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Documents]
      summary: Create a legal-document metadata record
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LegalDocumentInput' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  document: { $ref: '#/components/schemas/LegalDocument' }
        '400': { $ref: '#/components/responses/ValidationError' }
  /documents/stats:
    get:
      tags: [Documents]
      summary: Document statistics
      responses:
        '200': { $ref: '#/components/responses/Stats' }
  /documents/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [Documents]
      summary: Get a document
      responses:
        '200':
          description: Document
          content:
            application/json:
              schema:
                type: object
                properties:
                  document: { $ref: '#/components/schemas/LegalDocument' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Documents]
      summary: Update a document
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LegalDocumentInput' }
      responses:
        '200': { $ref: '#/components/responses/Message' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Documents]
      summary: Delete a document
      responses:
        '200': { $ref: '#/components/responses/Message' }

  /dashboard/overview:
    get:
      tags: [Dashboard]
      summary: Program overview (partners, contracts, revenue, KPIs, documents, amendments)
      responses:
        '200':
          description: Overview
          content:
            application/json:
              schema:
                type: object
                properties:
                  overview: { type: object }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /dashboard/revenue-trends:
    get:
      tags: [Dashboard]
      summary: Revenue trends
      parameters:
        - { in: query, name: periodType, schema: { type: string } }
      responses:
        '200':
          description: Trends
          content:
            application/json:
              schema:
                type: object
                properties:
                  trends: { type: array, items: { type: object } }
  /dashboard/top-partners:
    get:
      tags: [Dashboard]
      summary: Top-performing partners
      parameters:
        - { in: query, name: limit, schema: { type: integer, default: 5 } }
      responses:
        '200':
          description: Top partners
          content:
            application/json:
              schema: { type: object }

  /claims:
    get:
      tags: [Claims]
      summary: List partner revenue claims
      parameters:
        - { in: query, name: status, schema: { type: string } }
        - { in: query, name: partnerId, schema: { type: integer } }
        - { in: query, name: contractId, schema: { type: integer } }
      responses:
        '200':
          description: Claims
          content:
            application/json:
              schema:
                type: object
                properties:
                  claims:
                    type: array
                    items: { $ref: '#/components/schemas/Claim' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Claims]
      summary: Submit a partner revenue claim
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ClaimInput' }
      responses:
        '201':
          description: Submitted
          content:
            application/json:
              schema:
                type: object
                properties:
                  claim: { $ref: '#/components/schemas/Claim' }
        '400': { $ref: '#/components/responses/ValidationError' }
  /claims/stats:
    get:
      tags: [Claims]
      summary: Claim statistics
      responses:
        '200': { $ref: '#/components/responses/Stats' }
  /claims/export:
    get:
      tags: [Claims]
      summary: Export claims as CSV (tenant-scoped)
      parameters:
        - { in: query, name: status, schema: { type: string } }
        - { in: query, name: partnerId, schema: { type: integer } }
        - { in: query, name: contractId, schema: { type: integer } }
      responses:
        '200':
          description: CSV export
          content:
            text/csv:
              schema: { type: string }
  /claims/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [Claims]
      summary: Get a claim
      responses:
        '200':
          description: Claim
          content:
            application/json:
              schema:
                type: object
                properties:
                  claim: { $ref: '#/components/schemas/Claim' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Claims]
      summary: Update a claim (blocked once approved/rejected)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ClaimInput' }
      responses:
        '200': { $ref: '#/components/responses/Message' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [Claims]
      summary: Delete a claim
      responses:
        '200': { $ref: '#/components/responses/Message' }
  /claims/{id}/review:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    post:
      tags: [Claims]
      summary: Move a claim into review
      responses:
        '200': { $ref: '#/components/responses/Message' }
        '409': { $ref: '#/components/responses/Conflict' }
  /claims/{id}/request-clarification:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    post:
      tags: [Claims]
      summary: Request clarification on a claim
      responses:
        '200': { $ref: '#/components/responses/Message' }
        '409': { $ref: '#/components/responses/Conflict' }
  /claims/{id}/approve:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    post:
      tags: [Claims]
      summary: Approve a claim (server records the approved amount)
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                approvedAmount: { type: number }
                note: { type: string }
      responses:
        '200': { $ref: '#/components/responses/Message' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '409': { $ref: '#/components/responses/Conflict' }
  /claims/{id}/reject:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    post:
      tags: [Claims]
      summary: Reject a claim
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                note: { type: string }
      responses:
        '200': { $ref: '#/components/responses/Message' }
        '409': { $ref: '#/components/responses/Conflict' }
  /claims/{id}/verify-bank:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    post:
      tags: [Claims]
      summary: Record (or clear) bank verification for a claim
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                verified: { type: boolean, default: true }
      responses:
        '200': { $ref: '#/components/responses/Message' }
        '409': { $ref: '#/components/responses/Conflict' }
  /claims/{id}/verify-tax:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    post:
      tags: [Claims]
      summary: Record (or clear) tax verification for a claim
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                verified: { type: boolean, default: true }
      responses:
        '200': { $ref: '#/components/responses/Message' }
        '409': { $ref: '#/components/responses/Conflict' }
  /claims/{id}/mark-payout-ready:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    post:
      tags: [Claims]
      summary: Record the payout-ready milestone (blocked until approved + bank + tax verified; no money moves)
      responses:
        '200': { $ref: '#/components/responses/Message' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422':
