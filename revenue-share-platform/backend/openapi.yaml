components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    Id:
      in: path
      name: id
      required: true
      schema: { type: integer }

  responses:
    Unauthorized:
      description: Missing or invalid token
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Conflict:
      description: Conflict with current state
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    ValidationError:
      description: Missing or invalid fields
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Message:
      description: Operation result
      content:
        application/json:
          schema:
            type: object
            properties:
              message: { type: string }
    Stats:
      description: Aggregate statistics
      content:
        application/json:
          schema:
            type: object
            properties:
              stats: { type: object }

  schemas:
    Error:
      type: object
      properties:
        error: { type: string }
    User:
      type: object
      properties:
        id: { type: integer }
        email: { type: string }
        full_name: { type: string }
        role: { type: string }
    AuthResponse:
      type: object
      properties:
        message: { type: string }
        token: { type: string }
        user:
          type: object
          properties:
            id: { type: integer }
            email: { type: string }
            fullName: { type: string }
            role: { type: string }
    Partner:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        email: { type: string }
        company: { type: string }
        type: { type: string }
        status: { type: string }
        contact_person: { type: string }
        phone: { type: string }
        address: { type: string }
        notes: { type: string }
    PartnerInput:
      type: object
      required: [name, email]
      properties:
        name: { type: string }
        email: { type: string, format: email }
        company: { type: string }
        type: { type: string }
        status: { type: string }
        contactPerson: { type: string }
        phone: { type: string }
        address: { type: string }
        notes: { type: string }
    Contract:
      type: object
      properties:
        id: { type: integer }
        partner_id: { type: integer }
        partner_name: { type: string }
        title: { type: string }
        description: { type: string }
        start_date: { type: string, format: date }
        end_date: { type: string, format: date }
        revenue_share_percentage: { type: number }
        minimum_payout: { type: number }
        payment_terms: { type: string }
        status: { type: string }
    ContractInput:
      type: object
      required: [partnerId, title, startDate, revenueSharePercentage]
      properties:
        partnerId: { type: integer }
        title: { type: string }
        description: { type: string }
        startDate: { type: string, format: date }
        endDate: { type: string, format: date }
        revenueSharePercentage: { type: number }
        minimumPayout: { type: number }
        paymentTerms: { type: string }
        status: { type: string }
    Readiness:
      type: object
      properties:
        ready: { type: boolean }
        missing: { type: array, items: { type: string } }
        total: { type: integer }
        satisfied: { type: integer }
    Amendment:
      type: object
      properties:
        id: { type: integer }
        contract_id: { type: integer }
        contract_title: { type: string }
        article_reference: { type: string }
        amendment_type: { type: string }
        amendment_mechanism: { type: string }
        reason: { type: string }
        public_interest_basis: { type: string }
        necessity_confirmed: { type: boolean }
        no_new_contract_confirmed: { type: boolean }
        no_nature_change_confirmed: { type: boolean }
        notice_period_days: { type: integer }
        authority_source: { type: string }
        decision_date: { type: string, format: date }
        effective_date: { type: string, format: date }
        partner_impact: { type: string }
        calculation_method: { type: string }
        amendment_letter_reference: { type: string }
        notice_channels: { type: array, items: { type: string } }
        notice_message: { type: string }
        notice_message_language: { type: string }
        status: { type: string, enum: [draft, ready, notified, acknowledged] }
        readiness: { $ref: '#/components/schemas/Readiness' }
    AmendmentInput:
      type: object
      required: [contractId]
      properties:
        contractId: { type: integer }
        articleReference: { type: string }
        amendmentType: { type: string }
        amendmentMechanism: { type: string }
        reason: { type: string }
        publicInterestBasis: { type: string }
        necessityConfirmed: { type: boolean }
        noNewContractConfirmed: { type: boolean }
        noNatureChangeConfirmed: { type: boolean }
        noticePeriodDays: { type: integer }
        authoritySource: { type: string }
        decisionDate: { type: string, format: date }
        effectiveDate: { type: string, format: date }
        partnerImpact: { type: string }
        calculationMethod: { type: string }
        amendmentLetterReference: { type: string }
        noticeChannels: { type: array, items: { type: string } }
        noticeMessage: { type: string }
        noticeMessageLanguage: { type: string }
    RevenueShare:
      type: object
      properties:
        id: { type: integer }
        contract_id: { type: integer }
        contract_title: { type: string }
        partner_name: { type: string }
        period_start: { type: string, format: date }
        period_end: { type: string, format: date }
        total_revenue: { type: number }
        share_percentage: { type: number }
        share_amount: { type: number }
        status: { type: string }
        paid_at: { type: string, format: date-time }
        notes: { type: string }
    RevenueShareInput:
      type: object
      required: [contractId, periodStart, periodEnd, totalRevenue, sharePercentage]
      properties:
        contractId: { type: integer }
        periodStart: { type: string, format: date }
        periodEnd: { type: string, format: date }
        totalRevenue: { type: number }
        sharePercentage: { type: number }
        status: { type: string }
        notes: { type: string }
      description: >
        shareAmount is derived server-side from totalRevenue and
        sharePercentage; any client-supplied value is ignored.
    KPI:
      type: object
      properties:
        id: { type: integer }
        contract_id: { type: integer }
        contract_title: { type: string }
        name: { type: string }
        description: { type: string }
        target_value: { type: number }
        actual_value: { type: number }
        unit: { type: string }
        period_type: { type: string }
        status: { type: string }
    KPIInput:
      type: object
      required: [contractId, name, targetValue]
      properties:
        contractId: { type: integer }
        name: { type: string }
        description: { type: string }
        targetValue: { type: number }
        actualValue: { type: number }
        unit: { type: string }
        periodType: { type: string }
        status: { type: string }
    LegalDocument:
      type: object
      properties:
        id: { type: integer }
        contract_id: { type: integer }
        contract_title: { type: string }
        document_type: { type: string }
        document_name: { type: string }
        file_path: { type: string }
        file_url: { type: string }
        version: { type: string }
        status: { type: string }
    LegalDocumentInput:
      type: object
      required: [contractId, documentType, documentName]
      properties:
        contractId: { type: integer }
        documentType: { type: string }
        documentName: { type: string }
        filePath: { type: string }
        fileUrl: { type: string }
        version: { type: string }
        status: { type: string }
    Claim:
      type: object
      properties:
        id: { type: integer }
        tenant_id: { type: integer }
        partner_id: { type: integer }
        partner_name: { type: string }
        contract_id: { type: integer }
        contract_title: { type: string }
        period_start: { type: string, format: date }
        period_end: { type: string, format: date }
        basis: { type: string }
        claimed_amount: { type: number }
        approved_amount: { type: number }
        currency: { type: string }
        status: { type: string, enum: [submitted, under_review, needs_clarification, approved, rejected] }
        decision_note: { type: string }
        reviewed_by: { type: integer }
        reviewed_at: { type: string, format: date-time }
        bank_verified: { type: boolean }
        bank_verified_at: { type: string, format: date-time }
        tax_verified: { type: boolean }
        tax_verified_at: { type: string, format: date-time }
        payout_ready: { type: boolean }
        payout_ready_at: { type: string, format: date-time }
        payout_readiness: { $ref: '#/components/schemas/Readiness' }
    ClaimInput:
      type: object
      required: [partnerId]
      properties:
        partnerId: { type: integer }
        contractId: { type: integer }
        periodStart: { type: string, format: date }
        periodEnd: { type: string, format: date }
        basis: { type: string }
        claimedAmount: { type: number }
        currency: { type: string }
    Attribution:
      type: object
      properties:
        id: { type: integer }
        tenant_id: { type: integer }
        claim_id: { type: integer }
        partner_id: { type: integer }
        partner_name: { type: string }
        contract_id: { type: integer }
        outcome: { type: string, enum: [credited, declined, split] }
        weight: { type: number }
        rationale: { type: string }
        status: { type: string, enum: [proposed, confirmed] }
        decided_by: { type: integer }
        decided_at: { type: string, format: date-time }
    AttributionInput:
      type: object
      required: [partnerId]
      properties:
        partnerId: { type: integer }
        claimId: { type: integer }
        contractId: { type: integer }
        outcome: { type: string }
        weight: { type: number }
        rationale: { type: string }
    ProtectionWindow:
      type: object
      properties:
        id: { type: integer }
        tenant_id: { type: integer }
        partner_id: { type: integer }
        partner_name: { type: string }
        contract_id: { type: integer }
        claim_id: { type: integer }
        starts_at: { type: string, format: date }
        ends_at: { type: string, format: date }
        reason: { type: string }
        status: { type: string, enum: [active, expired, released] }
        effective_status: { type: string, enum: [active, expired, released] }
    ProtectionWindowInput:
      type: object
      required: [partnerId]
      properties:
        partnerId: { type: integer }
        contractId: { type: integer }
        claimId: { type: integer }
        startsAt: { type: string, format: date }
        endsAt: { type: string, format: date }
        reason: { type: string }
    EvidenceItem:
      type: object
      properties:
        id: { type: integer }
        tenant_id: { type: integer }
        claim_id: { type: integer }
        amendment_id: { type: integer }
        pack_id: { type: integer }
        pack_status: { type: string, enum: [draft, finalized] }
        pack_title: { type: string }
        type: { type: string }
        name: { type: string }
        description: { type: string }
        file_url: { type: string }
        added_by: { type: integer }
    EvidenceItemInput:
      type: object
      required: [name]
      properties:
        name: { type: string }
        type: { type: string }
        description: { type: string }
        fileUrl: { type: string, description: Reference link only; the platform stores no files }
        claimId: { type: integer }
        amendmentId: { type: integer }
        packId: { type: integer }
    EvidencePack:
      type: object
      properties:
        id: { type: integer }
        tenant_id: { type: integer }
        claim_id: { type: integer }
        title: { type: string }
        description: { type: string }
        status: { type: string, enum: [draft, finalized] }
        finalized_at: { type: string, format: date-time }
        item_count: { type: integer }
        items:
          type: array
          items: { $ref: '#/components/schemas/EvidenceItem' }
    EvidencePackInput:
      type: object
      required: [title]
      properties:
        title: { type: string }
        description: { type: string }
        claimId: { type: integer }
    AuditEvent:
      type: object
      properties:
        id: { type: integer }
        tenant_id: { type: integer }
